<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platcub</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { display: block; background: #000; }
  </style>
</head>
<body>
  <div id="wrap"><canvas id="unity-canvas" tabindex="-1"></canvas></div>

  <script src="Build/Platcub.loader.js"></script>
  <script>
    const canvas = document.querySelector("#unity-canvas");

    function fit() {
      const w = Math.min(window.innerWidth, window.innerHeight * 16 / 9);
      canvas.style.width = w + "px";
      canvas.style.height = (w * 9 / 16) + "px";
    }
    fit();
    window.addEventListener("resize", fit);

    createUnityInstance(canvas, {
      dataUrl: "Build/Platcub.data",
      frameworkUrl: "Build/Platcub.framework.js",
      codeUrl: "Build/Platcub.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Platcub",
      productVersion: "1.0"
    }).catch((e) => alert(e));
  </script>
</body>
</html>
